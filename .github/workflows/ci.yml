name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: test -z "$(gofmt -s -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # ./... rather than ./cmd/...: cmd/ does not exist yet, and this also
      # compiles the Linux-only netlink code that macOS builds skip.
      - run: GOOS=linux go build ./...
