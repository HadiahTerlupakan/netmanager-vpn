name: ci

on:
  push:
  pull_request:

# Tests and image builds only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: test -z "$(gofmt -s -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh deploy/install-hub_test.sh
      - run: sh -n deploy/install-hub.sh && bash -n deploy/netmanager-vpn-deploy.sh
      # ./... rather than ./cmd/...: cmd/ does not exist yet, and this also
      # compiles the Linux-only netlink code that macOS builds skip.
      - run: GOOS=linux go build ./...
