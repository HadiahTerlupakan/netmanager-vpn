name: build-image

# Tag: `<12 karakter commit>-<epoch commit>`. Rumusnya harus sama dengan
# deploy/netmanager-vpn-deploy.sh, yang menghitung ulang tag dari SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: hadiahterlupakan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh deploy/install-hub_test.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Hitung tag
        id: tag
        run: |
          set -euo pipefail
          EPOCH="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          echo "image=${REGISTRY}/${IMAGE_NAMESPACE}/netmanager-vpn:${GITHUB_SHA:0:12}-${EPOCH}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bangun image
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=docker
          tags: ${{ steps.tag.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image menampilkan flag -mode
        run: docker run --rm "${{ steps.tag.outputs.image }}" -h 2>&1 | grep -- '-mode'
      # Mendorong image lokal yang barusan lolos cek, bukan membangun ulang.
      - name: Dorong image
        run: docker push "${{ steps.tag.outputs.image }}"
